<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concurrent Bootstrapping — Feldera</title>
<style>
  :root{
    /* Feldera brand — light theme */
    --bg:#f1ecf2; --panel:#ffffff; --panel2:#faf3fa; --line:#ecd9ec; --line2:#e4cfe4;
    --text:#26102b; --muted:#8d7f95;
    --crimson:#d10a5c; --magenta:#e5127d; --purple:#7a2b8e; --plum:#3a1140;
    --green:#1f9d57; --greenText:#178a4b; --greenBg:#e6f6ee;
    --track:#efe7f0;
    --grad:linear-gradient(90deg,#e5127d,#8a2f96);
    --gradV:linear-gradient(180deg,#e5127d,#8a2f96);
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1100px 520px at 50% -8%, #f8f1f8, var(--bg)) fixed;color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px}
  header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;background:#fff}
  h1{margin:0;font-size:17px;font-weight:800;letter-spacing:.2px;color:var(--text)}
  h1 .brand{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);font-size:12.5px}
  .legend{margin-left:auto;color:var(--muted);font-size:12px;display:flex;gap:14px}
  .legend b{color:var(--text)}
  /* minmax(0,1fr) keeps the two columns exactly equal + fixed regardless of content width
     (plain 1fr has min-width:auto, so a column widens as its numbers grow -> width jitter) */
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;padding:18px 20px}
  .col{position:relative;min-width:0}
  /* banner */
  .banner{--c:var(--muted);border-radius:14px;padding:8px 15px;margin-bottom:10px;
    border:1px solid var(--line);border-left:3px solid var(--c);background:var(--panel2);box-shadow:0 1px 3px rgba(90,30,80,.05)}
  .banner .who{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .banner .state{font-size:13px;font-weight:800;margin-top:1px;display:flex;align-items:center;gap:7px;color:var(--c)}
  .dot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px color-mix(in srgb,currentColor 55%,transparent)}
  .banner .meta{font-size:10.5px;color:var(--muted);margin-top:2px;min-height:0}
  .pbar{height:4px;border-radius:3px;background:var(--track);margin-top:5px;overflow:hidden}
  .pbar>span{display:block;height:100%;width:0;background:var(--c);transition:width .3s}
  /* ingest gauge (hero) */
  .gauge{--c:var(--crimson);border-radius:14px;padding:10px 16px;margin-bottom:12px;border:1px solid var(--line);
    background:var(--panel);box-shadow:0 2px 10px rgba(120,30,110,.06)}
  .gtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .gauge .n{font-size:25px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--c)}
  .gauge .u{color:var(--muted);font-size:12px}
  .pill{font-size:11px;font-weight:800;padding:3px 11px;border-radius:999px;white-space:nowrap;letter-spacing:.03em;border:1px solid transparent}
  .pill.on{background:var(--greenBg);color:var(--greenText);border-color:color-mix(in srgb,var(--green) 30%,#fff)}
  .pill.off{background:#efe9f0;color:var(--muted);border-color:var(--line)}
  svg.spark{display:block;width:100%;height:30px;margin-top:6px}
  /* sections + cards */
  .sec{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700;
    margin:6px 2px 9px;display:flex;align-items:center;gap:9px}
  .secbadge{font-size:10px;font-weight:800;padding:2px 9px;border-radius:999px;letter-spacing:.04em;border:1px solid transparent}
  .b-live{background:var(--greenBg);color:var(--greenText);border-color:color-mix(in srgb,var(--green) 30%,#fff)}
  .b-frozen{background:#f8e6ef;color:var(--crimson);border-color:color-mix(in srgb,var(--crimson) 26%,#fff)}
  .b-wait{background:#f2ecf6;color:var(--purple);border-color:color-mix(in srgb,var(--purple) 24%,#fff)}
  .panels{display:grid;grid-template-columns:1fr;gap:11px;margin-bottom:8px;
    transition:opacity .35s ease, filter .35s ease}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 15px;box-shadow:0 2px 10px rgba(120,30,110,.05)}
  .card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .card-t{font-size:13px;font-weight:700;color:var(--text)}
  .card-b{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
  .building{color:var(--muted);font-size:13px;padding:16px 2px;text-align:center;letter-spacing:.02em}
  /* horizontal bars */
  .hbar{display:grid;grid-template-columns:78px 1fr 62px;align-items:center;gap:9px;margin:7px 0}
  .hlabel{font-size:12px;color:var(--muted);text-transform:capitalize;font-weight:600}
  .htrack{height:14px;background:var(--track);border-radius:7px;overflow:hidden}
  .hfill{display:block;height:100%;width:0;border-radius:7px;transition:width .45s ease;background:var(--grad)}
  .hval{font-size:12.5px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
  /* vertical bars (time series) */
  .vchart{display:flex;align-items:flex-end;gap:5px;height:118px;padding-top:16px}
  .vcol{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;min-width:0}
  .vbar-wrap{width:100%;flex:1;display:flex;align-items:flex-end;justify-content:center}
  .vbar{width:76%;max-width:20px;background:var(--gradV);border-radius:5px 5px 0 0;
    height:0;transition:height .45s ease;min-height:2px}
  .vval{font-size:9.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:3px;white-space:nowrap;font-weight:600}
  .vlabel{font-size:9px;color:var(--muted);margin-top:4px;white-space:nowrap}
  .reach .vbar{background:linear-gradient(180deg,#9b2c8f,#e5127d)}
  /* KPIs */
  .kpirow{display:flex;gap:10px;flex-wrap:wrap}
  .kpi{flex:1;min-width:88px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
  .kval{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--crimson)}
  .klabel{display:block;font-size:10.5px;color:var(--muted);margin-top:2px;font-weight:600}
  /* frozen = not ingesting: wash the color out of the charts so a stalled panel reads as dead */
  .col.frozen .panels{opacity:.45;filter:grayscale(1)}
  /* demo coach-marks: prominent brand-colored callouts (crimson = stop-the-world, green = live) */
  .col.cc-frozen{--cc:#d10a5c;--cc2:#a80b4a}   /* stop-the-world: brand crimson */
  .col.cc-live{--cc:#1f9d57;--cc2:#16824a}     /* concurrent / complete: brand green */
  .callout{position:absolute;top:92px;left:50%;transform:translate(-50%,-8px);width:94%;max-width:520px;
    z-index:30;pointer-events:none;border:none;border-radius:13px;
    background:linear-gradient(180deg,var(--cc,#888),var(--cc2,#666));
    padding:13px 17px;color:#fff;font-weight:700;font-size:13.5px;line-height:1.42;text-align:center;
    text-shadow:0 1px 2px rgba(0,0,0,.22);opacity:0;transition:opacity .45s ease,transform .45s ease}
  .callout.show{opacity:1;transform:translate(-50%,0);animation:ccpulse 1.9s ease-in-out infinite}
  .callout::after{content:'';position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);
    border:10px solid transparent;border-top-color:var(--cc2,#888);border-bottom:0}
  @keyframes ccpulse{0%,100%{box-shadow:0 10px 26px rgba(90,20,70,.16),0 0 0 color-mix(in srgb,var(--cc,#888) 0%,transparent)}
    50%{box-shadow:0 10px 26px rgba(90,20,70,.16),0 0 30px color-mix(in srgb,var(--cc,#888) 55%,transparent)}}
  .col.hi{border-radius:16px;box-shadow:0 0 0 2px color-mix(in srgb,var(--cc,#888) 45%,transparent),
    0 0 28px color-mix(in srgb,var(--cc,#888) 20%,transparent)}
  .done-callout{position:fixed;top:56px;left:50%;transform:translate(-50%,-10px);z-index:40;pointer-events:none;
    --cc:#1f9d57;--cc2:#16824a;border-radius:14px;padding:14px 32px;background:linear-gradient(180deg,var(--cc),var(--cc2));
    color:#fff;font-weight:800;font-size:17px;letter-spacing:.01em;text-shadow:0 1px 2px rgba(0,0,0,.22);
    opacity:0;transition:opacity .5s ease,transform .5s ease}
  .done-callout.show{opacity:1;transform:translate(-50%,0);animation:ccpulse 1.9s ease-in-out infinite}
  footer{color:var(--muted);font-size:11.5px;padding:10px 22px;border-top:1px solid var(--line);background:#fff}
</style>
</head>
<body>
<header>
  <h1><span class="brand">Feldera</span> — Concurrent vs Conventional Bootstrapping</h1>
</header>
<div class="cols" id="cols"></div>
<div class="done-callout" id="doneCallout">Bootstrapping complete: all views are live</div>
<footer id="foot">connecting…</footer>

<script>
const STATE_STYLE = {
  RUNNING:{c:'var(--green)',label:'RUNNING'},
  CONCURRENTBOOTSTRAPPING:{c:'var(--purple)',label:'CONCURRENT BOOTSTRAP'},
  SYNCHRONIZING:{c:'var(--magenta)',label:'SYNCHRONIZING'},
  BOOTSTRAPPING:{c:'var(--crimson)',label:'BOOTSTRAPPING (stop-the-world)'},
  REPLAYING:{c:'var(--purple)',label:'REPLAYING'},
  INITIALIZING:{c:'var(--muted)',label:'INITIALIZING'},
  STOPPED:{c:'var(--muted)',label:'STOPPED — ready to bootstrap'},
  unknown:{c:'var(--muted)',label:'STARTING…'},
};
const fmtC = n => n==null ? '—' :
  Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(n);
const fmtN = n => n==null ? '—' : n.toLocaleString();
const COLS = {};
const bootStart = {};
let prevPhase = 'idle', doneAt = null;   // for the "bootstrapping complete" callout

function ensureCol(name){
  if(COLS[name]) return COLS[name];
  const root=document.createElement('div'); root.className='col';
  root.innerHTML=`
    <div class="banner"><div class="who"></div><div class="state"><span class="dot"></span><span class="lbl"></span></div>
      <div class="meta"></div><div class="pbar"><span></span></div></div>
    <div class="gauge"><div class="gtop"><div><span class="n">0</span> <span class="u">records/sec ingested</span></div>
      <span class="pill off"></span></div>
      <svg class="spark" viewBox="0 0 300 38" preserveAspectRatio="none"><polyline fill="none" stroke-width="2"/></svg></div>
    <div class="sec">Live operations <span class="secbadge"></span></div>
    <div class="panels ex"></div>
    <div class="sec">New analytics <span class="secbadge2"></span></div>
    <div class="panels nw"></div>
    <div class="callout"></div>`;
  document.getElementById('cols').appendChild(root);
  const q=s=>root.querySelector(s);
  const refs={root,banner:q('.banner'),who:q('.who'),lbl:q('.lbl'),meta:q('.meta'),pfill:q('.pbar>span'),
    gauge:q('.gauge'),gn:q('.gauge .n'),pill:q('.pill'),spark:q('polyline'),callout:q('.callout'),
    secbadge:q('.secbadge'),secbadge2:q('.secbadge2'),ex:q('.panels.ex'),nw:q('.panels.nw'),panels:{}};
  COLS[name]=refs; return refs;
}

function sparkPoints(hist){
  if(!hist||hist.length<2) return '';
  const w=300,h=38,pad=2,mx=Math.max(...hist,1);
  return hist.map((v,i)=>{
    const x=pad+(w-2*pad)*i/(hist.length-1), y=h-pad-(h-2*pad)*v/mx;
    return x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
}

function renderPanel(wrap, panel){
  let pr=COLS._cur.panels[panel.view];
  if(!pr){
    const card=document.createElement('div'); card.className='card';
    if(panel.view.includes('reach')) card.classList.add('reach');
    card.innerHTML=`<div class="card-h"><span class="card-t"></span><span class="card-b"></span></div><div class="card-body"></div>`;
    wrap.appendChild(card);
    pr={card,title:card.querySelector('.card-t'),badge:card.querySelector('.card-b'),body:card.querySelector('.card-body'),
        kind:null,cells:[]};
    COLS._cur.panels[panel.view]=pr;
  }
  pr.title.textContent=panel.title;

  if(!panel.ready){
    if(pr.kind!=='building'){ pr.body.innerHTML='<div class="building">bootstrapping…</div>'; pr.kind='building'; pr.cells=[]; }
    pr.badge.textContent='';
    return;
  }
  pr.badge.textContent = panel.total ? (panel.unit==='$'?'$'+fmtC(panel.total):fmtC(panel.total)+(panel.unit?' '+panel.unit:'')) : '';

  if(panel.kind==='hbars'){
    const max=panel.scale||Math.max(1,...panel.rows.map(r=>r.value));
    if(pr.kind!=='hbars'||pr.cells.length!==panel.rows.length){
      pr.body.innerHTML=''; pr.cells=[];
      for(const _ of panel.rows){
        const row=document.createElement('div'); row.className='hbar';
        row.innerHTML=`<span class="hlabel"></span><span class="htrack"><span class="hfill"></span></span><span class="hval"></span>`;
        pr.body.appendChild(row);
        pr.cells.push({label:row.querySelector('.hlabel'),fill:row.querySelector('.hfill'),val:row.querySelector('.hval')});
      }
      pr.kind='hbars';
    }
    panel.rows.forEach((r,i)=>{const c=pr.cells[i];
      c.label.textContent=r.label; c.val.textContent=fmtC(r.value);
      c.fill.style.width=Math.min(100,100*r.value/max)+'%';});
  }
  else if(panel.kind==='vbars'){
    const max=panel.scale||Math.max(1,...panel.rows.map(r=>r.value));
    if(pr.kind!=='vbars'||pr.cells.length!==panel.rows.length){
      pr.body.innerHTML=''; pr.cells=[];
      const chart=document.createElement('div'); chart.className='vchart';
      for(const _ of panel.rows){
        const col=document.createElement('div'); col.className='vcol';
        col.innerHTML=`<span class="vval"></span><span class="vbar-wrap"><span class="vbar"></span></span><span class="vlabel"></span>`;
        chart.appendChild(col);
        pr.cells.push({bar:col.querySelector('.vbar'),val:col.querySelector('.vval'),label:col.querySelector('.vlabel')});
      }
      pr.body.appendChild(chart); pr.kind='vbars';
    }
    panel.rows.forEach((r,i)=>{const c=pr.cells[i];
      c.bar.style.height=(6+94*Math.min(1,r.value/max))+'%';
      c.val.textContent=panel.unit==='$'?'$'+fmtC(r.value):fmtC(r.value);
      c.label.textContent=r.label.length>5?r.label.slice(5):r.label;});
  }
  else { // kpi
    if(pr.kind!=='kpi'||pr.cells.length!==panel.metrics.length){
      pr.body.innerHTML=''; pr.cells=[];
      const row=document.createElement('div'); row.className='kpirow';
      for(const _ of panel.metrics){
        const k=document.createElement('div'); k.className='kpi';
        k.innerHTML=`<span class="kval"></span><span class="klabel"></span>`;
        row.appendChild(k);
        pr.cells.push({val:k.querySelector('.kval'),label:k.querySelector('.klabel')});
      }
      pr.body.appendChild(row); pr.kind='kpi';
    }
    panel.metrics.forEach((m,i)=>{pr.cells[i].val.textContent=fmtC(m.value); pr.cells[i].label.textContent=m.label;});
  }
}

function updateCol(name, st, showDone){
  const refs=ensureCol(name); COLS._cur=refs;
  const s=STATE_STYLE[st.runtime]||STATE_STYLE.unknown;
  const now=Date.now()/1000;
  const bootstrapping=['BOOTSTRAPPING','CONCURRENTBOOTSTRAPPING','SYNCHRONIZING','REPLAYING'].includes(st.runtime);
  if(bootstrapping && !bootStart[name]) bootStart[name]=now;
  if(st.runtime==='RUNNING'||st.runtime==='STOPPED') bootStart[name]=null;
  const elapsed=bootStart[name]?(now-bootStart[name]):null;
  const prog=st.bootstrap_progress!=null?Math.round(st.bootstrap_progress*100):null;
  const live=!!st.live;

  refs.banner.style.setProperty('--c',s.c);
  refs.who.textContent=name; refs.lbl.textContent=s.label; refs.banner.querySelector('.state').style.color=s.c;
  refs.meta.innerHTML = elapsed!=null ? ('bootstrap '+elapsed.toFixed(0)+'s'+(prog!=null?' · '+prog+'%':'')) : '';
  refs.pfill.style.width = prog!=null?prog+'%':'0';

  refs.gauge.style.setProperty('--c',live?'var(--crimson)':'var(--muted)');
  refs.gn.textContent=fmtN(st.throughput);
  refs.pill.className='pill '+(live?'on':'off'); refs.pill.textContent=live?'INGESTING':'PAUSED';
  refs.spark.setAttribute('points',sparkPoints(st.throughput_history||[]));
  refs.spark.setAttribute('stroke',live?'var(--crimson)':'var(--muted)');

  refs.secbadge.className='secbadge '+(live?'b-live':'b-frozen'); refs.secbadge.textContent=live?'LIVE':'FROZEN';
  const anyNewReady=(st.new||[]).some(p=>p.ready);
  refs.secbadge2.className='secbadge '+(anyNewReady?'b-live':'b-wait'); refs.secbadge2.textContent=anyNewReady?'READY':'BUILDING';

  refs.root.classList.toggle('frozen', !live);   // grey the charts whenever the stream is paused/frozen
  (st.existing||[]).forEach(p=>renderPanel(refs.ex,p));
  (st.new||[]).forEach(p=>renderPanel(refs.nw,p));

  // demo coach-mark: brand-colored callout (crimson=stop-the-world, green=live); keep text+color during fade-out
  let ctext=null, cc=null;
  if(st.runtime==='BOOTSTRAPPING'){ ctext='Stop-the-world bootstrapping: all views are frozen, ingest paused'; cc='cc-frozen'; }
  else if(st.runtime==='CONCURRENTBOOTSTRAPPING'||st.runtime==='SYNCHRONIZING'){
    ctext='Concurrent bootstrapping: Inputs are continuously ingested; existing views are updated in real-time'; cc='cc-live'; }
  else if(showDone){ cc='cc-live'; }
  if(ctext) refs.callout.textContent=ctext;
  if(cc){ refs.root.classList.remove('cc-frozen','cc-live'); refs.root.classList.add(cc); }  // sticky
  refs.callout.classList.toggle('show', !!ctext);
  refs.root.classList.toggle('hi', !!ctext || !!showDone);
}

async function poll(){
  try{
    const d=await (await fetch('/api/state')).json();
    // global phase: bootstrapping (either side) -> running (both) fires the completion callout
    const states=Object.values(d.pipelines).map(s=>s.runtime);
    const BOOT=['BOOTSTRAPPING','CONCURRENTBOOTSTRAPPING','SYNCHRONIZING','REPLAYING','INITIALIZING'];
    const phase=states.some(s=>BOOT.includes(s)) ? 'boot'
              : (states.length && states.every(s=>s==='RUNNING')) ? 'run' : 'idle';
    if(prevPhase==='boot' && phase==='run') doneAt=Date.now()/1000;   // just completed
    if(phase!=='run') doneAt=null;
    prevPhase=phase;
    const showDone = phase==='run' && doneAt && (Date.now()/1000-doneAt) < 10;
    for(const [name,st] of Object.entries(d.pipelines)) updateCol(name, st, showDone);
    document.getElementById('doneCallout').classList.toggle('show', !!showDone);
    document.getElementById('foot').textContent='polling /api/state · '+new Date().toLocaleTimeString();
  }catch(e){ document.getElementById('foot').textContent='waiting for dashboard server… '+e; }
}
setInterval(poll,500); poll();
</script>
</body>
</html>
